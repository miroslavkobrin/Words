<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <script src="jquery-4.0.0.min.js"></script>
    
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f2f5;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .step-counter {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .word-card {
            background: #fff;
            padding: 60px 20px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            font-size: 32px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            user-select: none; 
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #007bff;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 15px;
            text-align: center;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 18px;
            padding: 0 10px;
        }

        .correct-text { color: #28a745; }
        .wrong-text { color: #dc3545; }

        .modal {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 300px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            margin-top: 0;
            color: #007bff;
        }

        .close-btn {
            background: #007bff;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
            font-weight: bold;
            transition: background 0.3s;
            width: 100%;
        }

        .close-btn:hover {
            background: #0056b3;
        }

        @media (max-width: 480px) {
            .word-card { padding: 40px 15px; font-size: 26px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="step-counter">Слово: <span id="currentStep">1</span>/10</div>
        <div class="word-card" id="card">Завантаження...</div>
        <input type="text" id="userInput" placeholder="Введіть переклад...">
        <div class="stats">
            <span class="correct-text">Вірно: <span id="correctCount">0</span></span>
            <span class="wrong-text">Невірно: <span id="wrongCount">0</span></span>
        </div>
    </div>
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2>Результат!</h2>
            <p id="finalMessage"></p>
            <button class="close-btn" id="closeModal">Спробувати ще раз</button>
        </div>
    </div>
    <script src="Lr11.js"></script>
</body>
</html>
